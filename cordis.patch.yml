# ============================================================================
# dsh-novelforge —— DSH bundle patch（插件的“挂载声明”）
#
# DSH 启动时按 bundle 层栈叠加各插件的 patch，本文件把绒花墨坊插件插进 profile 的配置树。
#
# 安装（本地开发态）：
#   dsh plugin --profile desktop add link:E:\CODE\CangKu\dsh-novelforge
#   dsh plugin --profile headless add link:E:\CODE\CangKu\dsh-novelforge   # 只跑 headless 时
#
# ⚠ 装完要重启 DSH（桌面端要含托盘完全退出再开）—— 插件不进热更。
# ⚠ id 与 name 必须等于 package.json 的 name：不一致的症状是“装了但插件不出现”
#   （宿主按名字找模块）。测试里钉着这一条。
# ============================================================================

- insert:
    - id: dsh-novelforge
      name: dsh-novelforge
